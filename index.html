<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090811"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Nezuko"><title>Nezuko 🌸</title><style>
:root{color-scheme:dark;--glow:#fa82bf;--bg:#090811}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f8f4fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{min-height:100dvh;overflow:hidden;background:radial-gradient(ellipse 80% 55% at 50% 38%,color-mix(in srgb,var(--glow) 10%,transparent),transparent 70%),#090811;transition:background 1s}.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 28px)}header{text-align:center}header h1{font-size:27px;letter-spacing:.14em;font-weight:650;margin:0}header p{font-size:12px;letter-spacing:.12em;opacity:.52;margin:8px 0}.center{width:100%;display:flex;flex-direction:column;align-items:center;gap:32px}.bot{width:min(78vw,310px);aspect-ratio:1;border-radius:27%;background:radial-gradient(circle at 50% 38%,#1a1822,#0c0b11 70%);box-shadow:0 0 85px color-mix(in srgb,var(--glow) 14%,transparent),inset 0 0 0 1px #ffffff13;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation;transition:box-shadow .8s,transform .3s}.bot:active{transform:scale(.97)}.eyes{display:flex;gap:clamp(20px,6vw,34px);align-items:center}.eye{width:clamp(48px,15vw,68px);height:clamp(78px,24vw,106px);border-radius:48% 48% 46% 46%;background:var(--glow);box-shadow:0 0 16px color-mix(in srgb,var(--glow) 70%,transparent),0 0 46px color-mix(in srgb,var(--glow) 28%,transparent);position:relative;transform-origin:center;transition:background .7s,box-shadow .7s,transform .25s,height .35s,border-radius .35s;animation:blink 7.5s infinite}.eye:after{content:"";position:absolute;top:12%;left:22%;width:25%;height:16%;background:#fff7;border-radius:50%;filter:blur(6px)}@keyframes blink{0%,43%,46%,100%{scale:1 1}44.5%{scale:1 .06}}.bot.sleep .eye{height:9px;border-radius:50%;animation:none}.bot.happy .eye{height:55px;border-radius:12px 12px 90% 90%;transform:rotate(-12deg)}.bot.happy .eye+ .eye{transform:rotate(12deg)}.bot.surprised .eye{height:100px;width:78px;border-radius:50%}.bot.angry .eye:first-child{transform:rotate(20deg)}.bot.angry .eye:last-child{transform:rotate(-20deg)}.bot.listening .eye{animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{scale:1.06 .87;filter:brightness(1.35)}}.status{text-align:center}.status strong{font-size:20px;font-weight:600}.status p{font-size:13px;color:#c5bacb;margin:8px 0 0}.controls{width:min(100%,440px)}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-bottom:19px}.chip{border:1px solid #ffffff24;border-radius:99px;padding:10px 12px;background:#ffffff0a;color:#f5eef7;font-size:13px}.chip.active{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 16%,#121019)}.actions{display:flex;gap:10px}.action{flex:1;border:1px solid #ffffff25;border-radius:17px;padding:15px 9px;color:white;background:#ffffff12;font-weight:600;font-size:14px}.action.primary{background:var(--glow);color:#140b16;border:0}.hint{text-align:center;color:#a99dab;font-size:11px;margin:15px 0 0;line-height:1.5}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid white;outline-offset:3px}@media(max-height:650px){.app{padding-top:12px;padding-bottom:12px}.center{gap:13px}.bot{width:min(45vh,250px)}.chips{margin-bottom:8px}.status p{margin-top:3px}}
</style></head><body><main class="app"><header><h1>NEZUKO <span aria-hidden="true">🌸</span></h1><p>IL TUO PICCOLO COMPAGNO</p></header><section class="center"><div class="bot" id="bot" role="button" tabindex="0" aria-label="Tocca Nezuko per farla reagire"><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div><div class="status" aria-live="polite"><strong id="mood">Affettuosa 🩷</strong><p id="caption">Toccami e guarda come reagisco!</p></div></section><section class="controls"><div class="chips" id="chips"><button class="chip active" data-mood="love">🩷 Dolce</button><button class="chip" data-mood="calm">💙 Calma</button><button class="chip" data-mood="happy">💚 Felice</button><button class="chip" data-mood="curious">💜 Curiosa</button><button class="chip" data-mood="surprised">💛 Sorpresa</button><button class="chip" data-mood="sleep">😴 Sonno</button></div><div class="actions"><button class="action" id="auto">🌈 Auto: ON</button><button class="action primary" id="chat">💬 Apri ChatGPT</button></div><p class="hint">Tocca Nezuko per farle cambiare emozione.<br>La chat e i ricordi rimangono nell'app ChatGPT.</p></section></main><script>
const moods={love:{color:'#fa82bf',name:'Affettuosa 🩷',caption:'Sono felice di vederti!',shape:''},calm:{color:'#65bbff',name:'Tranquilla 💙',caption:'Sono qui con te.',shape:''},happy:{color:'#7af2a1',name:'Felice 💚',caption:'Che bella giornata!',shape:'happy'},curious:{color:'#b894ff',name:'Curiosa 💜',caption:'Chissà cosa succederà!',shape:''},surprised:{color:'#ffe27b',name:'Sorpresa 💛',caption:'Oh! Non me lo aspettavo!',shape:'surprised'},sleep:{color:'#c4b7d9',name:'Assonnata 😴',caption:'Faccio un pisolino...',shape:'sleep'},angry:{color:'#ff777c',name:'Imbronciata ❤️',caption:'Ehi, mi hai sorpresa!',shape:'angry'},listening:{color:'#fff',name:'Ti ascolto 🤍',caption:'Eccomi!',shape:'listening'}};
const root=document.documentElement,bot=document.getElementById('bot'),chips=document.getElementById('chips');let active='love',automatic=true,lastTouch=Date.now(),taps=0;const sequence=['love','happy','curious','surprised','calm','love'];function setMood(key){const m=moods[key];active=key;root.style.setProperty('--glow',m.color);document.getElementById('mood').textContent=m.name;document.getElementById('caption').textContent=m.caption;bot.className='bot '+m.shape;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.mood===key));}function touch(){lastTouch=Date.now();taps++;setMood(sequence[taps%sequence.length]);}bot.addEventListener('click',touch);bot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();touch()}});chips.addEventListener('click',e=>{let b=e.target.closest('[data-mood]');if(b){lastTouch=Date.now();setMood(b.dataset.mood)}});document.getElementById('auto').addEventListener('click',e=>{automatic=!automatic;e.currentTarget.textContent='🌈 Auto: '+(automatic?'ON':'OFF');lastTouch=Date.now()});document.getElementById('chat').addEventListener('click',()=>{window.location.href='https://chatgpt.com/'});setInterval(()=>{if(!automatic||document.hidden)return;const idle=Date.now()-lastTouch;if(idle>110000){setMood('sleep')}else if(idle>22000){const h=new Date().getHours();const options=h>=22||h<7?['sleep','calm','love']:['calm','curious','happy','love'];setMood(options[Math.floor(Math.random()*options.length)])}},15000);
</script></body></html>
